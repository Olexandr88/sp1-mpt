[workspace]
members = ["lib", "program", "script"]
resolver = "2"

[workspace.dependencies]
eyre = "0.6"
bincode = "1.3.3"
tracing = { version = "0.1.40", default-features = false }
tracing-profile = { git = "https://gitlab.com/IrreducibleOSS/tracing-profile.git", rev = "36b52268bcc6b9dffbf50851df43256cf1d17ce2" }
# cfg-if = "1.0.0"
# spin = { version = "0.9.8", features = ["mutex"] }
# async-trait = "0.1.80"
# tokio = { version = "1.21", default-features = false, features = [
#     "rt",
#     "rt-multi-thread",
# ] }
serde_json = "1.0.94"
serde = { version = "1.0", default-features = false, features = ["derive"] }
# futures = "0.3"
url = "2.3"
# thiserror = "1.0.61"
hex-literal = "0.4.1"
# rayon = "1.10.0"
rlp = "0.5.2"


