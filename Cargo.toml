[workspace]
members = ["lib", "program", "script"]
resolver = "2"

[workspace.dependencies]
eyre = "0.6"
bincode = "1.3.3"
tracing = { version = "0.1.40", default-features = false }
tracing-profile = { git = "https://gitlab.com/IrreducibleOSS/tracing-profile.git", rev = "36b52268bcc6b9dffbf50851df43256cf1d17ce2" }
serde_json = "1.0.94"
serde = { version = "1.0", default-features = false, features = ["derive"] }
url = "2.3"
hex-literal = "0.4.1"
rlp = "0.5.2"


# alloy
alloy-primitives = { version = "0.8.4", features = ["tiny-keccak"] }
alloy = { version = "0.9.2", features = ["rpc", "rpc-types", "tiny-keccak"] }
alloy-rpc-types = { version = "0.3", default-features = false, features = [
    "eth",
] }
alloy-rlp = "0.3.10"
alloy-trie = "0.7.6"
nybbles = "0.3.4"


[patch.crates-io]
# Precompile patches
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "tiny_keccak-v2.0.2-patch-v1" }
